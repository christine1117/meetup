# Refresh the competition list once a day (06:00 Taiwan time), or by hand
# from the Actions tab. Tests run first; if they fail, nothing is crawled.
# The run log (what was kept, skipped and why) stays in the Actions tab.
name: Refresh competitions

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency: competitions

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Crawl
        run: npm run crawl
      - name: Commit and publish if the list changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/competitions.json crawler/cache.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/competitions.json crawler/cache.json
          git commit -m "Refresh competitions"
          git push
          # Pushes from this token do not always start a Pages build, so ask for one
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
