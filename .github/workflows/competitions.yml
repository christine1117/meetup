# Refresh the competition list once a day (06:00 Taiwan time), or by hand
# from the Actions tab. Tests run first; if they fail, nothing is crawled.
#
# Secrets (Settings > Secrets and variables > Actions):
#   OPENAI_API_KEY or ANTHROPIC_API_KEY   lets an LLM read team-size rules (one is enough;
#                                         without either, rules are not read)
#   LLM_MODEL (a variable, optional)      a different model, e.g. gpt-5 instead of gpt-5-mini
#   LLM_EFFORT (a variable, optional)     how much it thinks first: minimal, low (default), medium, high
#   SUPABASE_URL               the database, once it is set up (optional)
#   SUPABASE_SERVICE_ROLE_KEY  the database key for the crawler (optional)
# The run log (what was listed, skipped, sent for review, and why) stays in the Actions tab.
name: Refresh competitions

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      reread:
        description: "Read every competition again with the LLM (costs tokens; normally only new or changed pages are read)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: competitions

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r crawler/requirements.txt
      - name: Test
        run: npm test
      # New interface text gets its Chinese line (lines already there are never changed)
      - name: Translate new interface text
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: .venv/bin/python tools/translate_ui.py
      - name: Crawl
        id: crawl
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_EFFORT: ${{ vars.LLM_EFFORT }}
          LLM_REREAD: ${{ inputs.reread && '1' || '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run crawl
      # Runs even if saving to the database failed, so what the LLM read is not lost.
      # Cloudflare picks up the push and updates the website.
      - name: Commit if the list changed
        if: ${{ !cancelled() && steps.crawl.outcome != 'skipped' }}
        run: |
          if [ -z "$(git status --porcelain -- data crawler/cache.json src/shared/locales)" ]; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data crawler/cache.json src/shared/locales
          git commit -m "Refresh competitions and translations"
          # Someone may have pushed during the run: take their changes first, then push (a few tries)
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 10
          done
          exit 1
